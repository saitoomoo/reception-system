# Local Docker image smoke-test.
# This is NOT the live development setup (use `go run` + `vite dev` for that).
# Use this to verify the production Docker images work correctly before pushing.
#
# Usage:
#   docker compose build
#   docker compose up
#   # frontend → http://localhost:5173  backend → http://localhost:8080
#   docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventdb
      POSTGRES_USER: app
      POSTGRES_PASSWORD: apppassword
    ports:
      - "5433:5432"   # 5433 to avoid conflicting with any local postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d eventdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://app:apppassword@postgres:5432/eventdb?sslmode=disable
      SESSION_SECRET: local-docker-secret-change-in-prod
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
