syntax = "proto3";

package ticket.v1;

option go_package = "reception-system/gen/go/ticket/v1;ticketv1";

// TicketService handles ticket issuance, status polling, and cancellation.
service TicketService {
  // CreateTicket issues a ticket after age checks, cooldown check, and optional parental consent.
  // Corresponds to the CreateTicket flow in ticket.md §6.
  rpc CreateTicket(CreateTicketRequest) returns (CreateTicketResponse);

  // GetTicketStatus returns the current status and queue position of a ticket.
  rpc GetTicketStatus(GetTicketStatusRequest) returns (GetTicketStatusResponse);

  // ListMyTickets returns all tickets held by the caller.
  rpc ListMyTickets(ListMyTicketsRequest) returns (ListMyTicketsResponse);

  // CancelTicket cancels a ticket in waiting / called / pending state (R-014).
  rpc CancelTicket(CancelTicketRequest) returns (CancelTicketResponse);

  // GetTicketStatusByReceptionNumber looks up a visitor's ticket at a specific booth
  // using only their reception number (PIN-free, read-only).
  rpc GetTicketStatusByReceptionNumber(GetTicketStatusByReceptionNumberRequest)
      returns (GetTicketStatusByReceptionNumberResponse);
}

// -----------------------------------------------------------------------------
// Shared types
// -----------------------------------------------------------------------------

// ParticipantInput represents one participant's info at ticket creation time.
message ParticipantInput {
  int32  age  = 1;
  // Required when age < 13 (R-005).
  string name = 2;
}

// ParentalConsentInput is required when any participant is aged 10–12 (R-005-2).
message ParentalConsentInput {
  string guardian_name          = 1;
  // Full text of the risk explanation shown to the guardian (snapshot at consent time).
  string consent_text_snapshot  = 2;
  string user_agent             = 3;
  // Client IP address recorded for the consent trail.
  string ip_address             = 4;
}

message TicketSummary {
  string ticket_id   = 1;
  string booth_id    = 2;
  string booth_name  = 3;
  string status      = 4;
  // 0-based position ahead in the queue (pending excluded per R-012).
  int32  position    = 5;
}

// -----------------------------------------------------------------------------
// CreateTicket
// -----------------------------------------------------------------------------

message CreateTicketRequest {
  string visitor_id = 1;
  string booth_id   = 2;
  // PIN re-confirmation for additional auth (ticket.md §5-3).
  string pin        = 3;

  repeated ParticipantInput participants = 4;

  // Only set for matchmaking booths ("public" or "private").
  string match_mode = 5;

  // Required when any participant is aged 10–12.
  ParentalConsentInput parental_consent = 6;
}

message CreateTicketResponse {
  string ticket_id        = 1;
  string status           = 2;
  int32  sequence_in_booth = 3;
  // 0-based position ahead in the queue at creation time.
  int32  position         = 4;
}

// -----------------------------------------------------------------------------
// GetTicketStatus
// -----------------------------------------------------------------------------

message GetTicketStatusRequest {
  string ticket_id = 1;
}

// MatchmakingInfo is included for matchmaking booths to show queue context.
message MatchmakingInfo {
  // "public" or "private"
  string match_mode           = 1;
  // Number of public-waiting participants ahead (public mode only).
  int32  public_waiting_count = 2;
  int32  target_party_size    = 3;
}

message GetTicketStatusResponse {
  string ticket_id         = 1;
  string booth_id          = 2;
  string booth_name        = 3;
  string booth_location    = 4;
  string status            = 5;
  int32  position          = 6;
  int32  sequence_in_booth = 7;
  string created_at        = 8;
  // Set only for matchmaking booths.
  MatchmakingInfo matchmaking_info = 9;
}

// -----------------------------------------------------------------------------
// ListMyTickets
// -----------------------------------------------------------------------------

message ListMyTicketsRequest {
  string visitor_id = 1;
}

message ListMyTicketsResponse {
  repeated TicketSummary tickets = 1;
}

// -----------------------------------------------------------------------------
// CancelTicket
// -----------------------------------------------------------------------------

message CancelTicketRequest {
  string ticket_id  = 1;
  // visitor_id is used for ownership verification.
  string visitor_id = 2;
}

message CancelTicketResponse {}

// -----------------------------------------------------------------------------
// GetTicketStatusByReceptionNumber
// -----------------------------------------------------------------------------

message GetTicketStatusByReceptionNumberRequest {
  string booth_id          = 1;
  string reception_number  = 2;
}

// Read-only view of a visitor's ticket at a specific booth.
// Returns the most recent non-cancelled ticket for this visitor at this booth.
message GetTicketStatusByReceptionNumberResponse {
  string ticket_id         = 1;
  string booth_name        = 2;
  string booth_location    = 3;
  string status            = 4;
  // 0-based position ahead in the queue (pending excluded per R-012).
  int32  position          = 5;
  int32  sequence_in_booth = 6;
  string reception_number  = 7;
}
