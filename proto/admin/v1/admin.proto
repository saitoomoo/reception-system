syntax = "proto3";

package admin.v1;

option go_package = "reception-system/gen/go/admin/v1;adminv1";

// AdminService is for global admins only.
service AdminService {
  // LoginAsGlobalAdmin authenticates with name + password and sets a session cookie.
  rpc LoginAsGlobalAdmin(LoginAsGlobalAdminRequest) returns (LoginAsGlobalAdminResponse);

  // GetDashboard returns per-booth waiting/admitted counts for the admin overview.
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);

  // UpdateBooth updates mutable booth settings.
  rpc UpdateBooth(UpdateBoothRequest) returns (UpdateBoothResponse);

  // ListAdminBooths returns all booths (including archived) for admin management.
  rpc ListAdminBooths(ListAdminBoothsRequest) returns (ListAdminBoothsResponse);

  // CreateBooth creates a new booth.
  rpc CreateBooth(CreateBoothRequest) returns (CreateBoothResponse);

  // ArchiveBooth soft-deletes a booth (sets is_archived=true).
  rpc ArchiveBooth(ArchiveBoothRequest) returns (ArchiveBoothResponse);

  // UnarchiveBooth restores an archived booth.
  rpc UnarchiveBooth(UnarchiveBoothRequest) returns (UnarchiveBoothResponse);

  // DeleteBooth permanently deletes a booth (only allowed when no active tickets).
  rpc DeleteBooth(DeleteBoothRequest) returns (DeleteBoothResponse);

  // UpdateBoothPassword changes the staff shared password for a booth.
  rpc UpdateBoothPassword(UpdateBoothPasswordRequest) returns (UpdateBoothPasswordResponse);

  // GetRiskExplanation returns the current singleton risk explanation text.
  rpc GetRiskExplanation(GetRiskExplanationRequest) returns (GetRiskExplanationResponse);

  // UpdateRiskExplanation replaces the risk explanation body.
  rpc UpdateRiskExplanation(UpdateRiskExplanationRequest) returns (UpdateRiskExplanationResponse);

  // ListNotificationTemplates returns all notification templates for editing.
  rpc ListNotificationTemplates(ListNotificationTemplatesRequest) returns (ListNotificationTemplatesResponse);

  // UpdateNotificationTemplate updates a notification template by key.
  rpc UpdateNotificationTemplate(UpdateNotificationTemplateRequest) returns (UpdateNotificationTemplateResponse);

  // ExportCSV exports event data as a UTF-8 BOM CSV file.
  rpc ExportCSV(ExportCSVRequest) returns (ExportCSVResponse);

  // ResetEventData deletes all event data (visitors, tickets, etc.) while preserving
  // booth/admin/template configuration. Only available when APP_ENV != "production".
  rpc ResetEventData(ResetEventDataRequest) returns (ResetEventDataResponse);
}

// StaffService is for booth staff authenticated with a booth-specific shared password.
service StaffService {
  // LoginAsStaff authenticates with booth_id + password and sets a session cookie.
  rpc LoginAsStaff(LoginAsStaffRequest) returns (LoginAsStaffResponse);

  // CallTicket transitions a single waiting ticket to called.
  rpc CallTicket(CallTicketRequest) returns (CallTicketResponse);

  // CallNextTickets transitions the first N waiting tickets for the staff's booth to called.
  rpc CallNextTickets(CallNextTicketsRequest) returns (CallNextTicketsResponse);

  // AdmitByQR looks up a visitor by reception_number and admits them (or restores from pending).
  rpc AdmitByQR(AdmitByQRRequest) returns (AdmitByQRResponse);

  // AdmitManually performs the same logic as AdmitByQR but can force-admit a waiting ticket.
  rpc AdmitManually(AdmitManuallyRequest) returns (AdmitManuallyResponse);

  // CancelTicketByStaff cancels a ticket within the staff's booth.
  rpc CancelTicketByStaff(CancelTicketByStaffRequest) returns (CancelTicketByStaffResponse);

  // GetStaffSession returns the booth_id and booth_name stored in the staff session cookie.
  rpc GetStaffSession(GetStaffSessionRequest) returns (GetStaffSessionResponse);

  // ListTicketsByBooth returns all tickets for the authenticated staff's booth.
  rpc ListTicketsByBooth(ListTicketsByBoothRequest) returns (ListTicketsByBoothResponse);

  // RestorePendingTicket manually moves a pending ticket back to called with priority flag.
  rpc RestorePendingTicket(RestorePendingTicketRequest) returns (RestorePendingTicketResponse);

  // ForceStartMatch force-starts a match session with the current public waiting tickets
  // (requires at least min_party_size participants).
  rpc ForceStartMatch(ForceStartMatchRequest) returns (ForceStartMatchResponse);

  // CallPrivateMatch calls all tickets in a private waiting match session (waiting → called).
  rpc CallPrivateMatch(CallPrivateMatchRequest) returns (CallPrivateMatchResponse);

  // CompleteMatchSession marks a session as completed and admits all its tickets.
  rpc CompleteMatchSession(CompleteMatchSessionRequest) returns (CompleteMatchSessionResponse);

  // GetMatchQueueStatus returns the current match queue for the staff's matchmaking booth.
  rpc GetMatchQueueStatus(GetMatchQueueStatusRequest) returns (GetMatchQueueStatusResponse);

  // CreateTicketManual issues a ticket on behalf of a visitor via the special in-person
  // staff flow for participants aged 7-9 (paper_and_digital consent, R-005).
  rpc CreateTicketManual(CreateTicketManualRequest) returns (CreateTicketManualResponse);
}

// -----------------------------------------------------------------------------
// Shared types
// -----------------------------------------------------------------------------

// AdmitOutcome describes the result of a QR scan or manual admission attempt.
enum AdmitOutcome {
  ADMIT_OUTCOME_UNSPECIFIED           = 0;
  // Ticket moved to admitted; admission record created.
  ADMIT_OUTCOME_ADMITTED              = 1;
  // Ticket was pending; moved back to called with is_priority_call=true.
  ADMIT_OUTCOME_RESTORED_TO_PRIORITY_CALL = 2;
  // Ticket is still in waiting state; operator must confirm before admitting.
  ADMIT_OUTCOME_WAITING_CONFIRMATION_NEEDED = 3;
  // Ticket was already in admitted state.
  ADMIT_OUTCOME_ALREADY_ADMITTED      = 4;
  // No active ticket found for this visitor at this booth.
  ADMIT_OUTCOME_NOT_FOUND             = 5;
}

message BoothStats {
  string booth_id      = 1;
  string booth_name    = 2;
  int32  waiting_count = 3;
  int32  pending_count = 4;
  int32  admitted_today = 5;
}

// -----------------------------------------------------------------------------
// LoginAsGlobalAdmin
// -----------------------------------------------------------------------------

message LoginAsGlobalAdminRequest {
  string name     = 1;
  string password = 2;
}

message LoginAsGlobalAdminResponse {}

// -----------------------------------------------------------------------------
// GetDashboard
// -----------------------------------------------------------------------------

message GetDashboardRequest {}

message GetDashboardResponse {
  repeated BoothStats booths = 1;
}

// -----------------------------------------------------------------------------
// UpdateBooth
// -----------------------------------------------------------------------------

message UpdateBoothRequest {
  string booth_id                       = 1;
  string name                           = 2;
  string description                    = 3;
  string location                       = 4;
  string open_at                        = 5;
  string close_at                       = 6;
  string experience_type                = 7;
  int32  max_participants_per_ticket    = 8;
  int32  concurrent_capacity            = 9;
  int32  target_party_size              = 10;
  int32  min_party_size                 = 11;
  bool   allow_private_match            = 12;
  int32  estimated_minutes_per_person   = 13;
  int32  estimated_minutes_per_session  = 14;
  int32  call_threshold                 = 15;
  int32  call_resend_minutes            = 16;
  int32  cooldown_minutes               = 17;
  bool   is_accepting                   = 18;
  string cover_image_url                = 19;
  string intro_video_url                = 20;
  string survey_url                     = 21;
  string notes                          = 22;
  string detail_video_url               = 23;
}

message UpdateBoothResponse {}

// -----------------------------------------------------------------------------
// AdminBooth (full booth record for management UI)
// -----------------------------------------------------------------------------

message AdminBooth {
  string booth_id                       = 1;
  string name                           = 2;
  string description                    = 3;
  string location                       = 4;
  string open_at                        = 5;
  string close_at                       = 6;
  string experience_type                = 7;
  int32  max_participants_per_ticket    = 8;
  int32  concurrent_capacity            = 9;
  int32  target_party_size              = 10;
  int32  min_party_size                 = 11;
  bool   allow_private_match            = 12;
  int32  estimated_minutes_per_person   = 13;
  int32  estimated_minutes_per_session  = 14;
  int32  call_threshold                 = 15;
  int32  call_resend_minutes            = 16;
  int32  cooldown_minutes               = 17;
  bool   is_accepting                   = 18;
  string cover_image_url                = 19;
  string intro_video_url                = 20;
  string survey_url                     = 21;
  bool   is_archived                    = 22;
  string staff_password_updated_at      = 23;
  string notes                          = 24;
  string detail_video_url               = 25;
}

// -----------------------------------------------------------------------------
// ListAdminBooths
// -----------------------------------------------------------------------------

message ListAdminBoothsRequest {}

message ListAdminBoothsResponse {
  repeated AdminBooth booths = 1;
}

// -----------------------------------------------------------------------------
// CreateBooth
// -----------------------------------------------------------------------------

message CreateBoothRequest {
  string name                           = 1;
  string description                    = 2;
  string location                       = 3;
  string open_at                        = 4;
  string close_at                       = 5;
  string experience_type                = 6;
  int32  max_participants_per_ticket    = 7;
  int32  concurrent_capacity            = 8;
  int32  target_party_size              = 9;
  int32  min_party_size                 = 10;
  bool   allow_private_match            = 11;
  int32  estimated_minutes_per_person   = 12;
  int32  estimated_minutes_per_session  = 13;
  int32  call_threshold                 = 14;
  int32  call_resend_minutes            = 15;
  int32  cooldown_minutes               = 16;
  bool   is_accepting                   = 17;
  string cover_image_url                = 18;
  string intro_video_url                = 19;
  string survey_url                     = 20;
  string staff_password                 = 21;
  string notes                          = 22;
  string detail_video_url               = 23;
}

message CreateBoothResponse {
