}

// -----------------------------------------------------------------------------
// ArchiveBooth
// -----------------------------------------------------------------------------

message ArchiveBoothRequest {
  string booth_id = 1;
}

message ArchiveBoothResponse {}

// -----------------------------------------------------------------------------
// UnarchiveBooth
// -----------------------------------------------------------------------------

message UnarchiveBoothRequest {
  string booth_id = 1;
}

message UnarchiveBoothResponse {}

// -----------------------------------------------------------------------------
// DeleteBooth
// -----------------------------------------------------------------------------

message DeleteBoothRequest {
  string booth_id = 1;
}

message DeleteBoothResponse {}

// -----------------------------------------------------------------------------
// UpdateBoothPassword
// -----------------------------------------------------------------------------

message UpdateBoothPasswordRequest {
  string booth_id      = 1;
  string new_password  = 2;
}

message UpdateBoothPasswordResponse {}

// -----------------------------------------------------------------------------
// LoginAsStaff
// -----------------------------------------------------------------------------

message LoginAsStaffRequest {
  string booth_id  = 1;
  string password  = 2;
}

message LoginAsStaffResponse {
  string booth_id   = 1;
  string booth_name = 2;
}

// -----------------------------------------------------------------------------
// CallTicket
// -----------------------------------------------------------------------------

message CallTicketRequest {
  string ticket_id = 1;
}

message CallTicketResponse {}

// -----------------------------------------------------------------------------
// CallNextTickets
// -----------------------------------------------------------------------------

message CallNextTicketsRequest {
  // Number of waiting tickets to call; must be >= 1.
  int32 count = 1;
}

message CallNextTicketsResponse {
  // IDs of tickets that were transitioned to called.
  repeated string ticket_ids = 1;
}

// -----------------------------------------------------------------------------
// AdmitByQR
// -----------------------------------------------------------------------------

message AdmitByQRRequest {
  // Reception number decoded from the visitor's QR code.
  string reception_number = 1;
}

message AdmitByQRResponse {
  AdmitOutcome outcome  = 1;
  string       ticket_id = 2;
}

// -----------------------------------------------------------------------------
// AdmitManually
// -----------------------------------------------------------------------------

message AdmitManuallyRequest {
  string reception_number = 1;
  // If true, force-admit even if the ticket is still in waiting state.
  bool   force            = 2;
}

message AdmitManuallyResponse {
  AdmitOutcome outcome   = 1;
  string       ticket_id = 2;
}

// -----------------------------------------------------------------------------
// CancelTicketByStaff
// -----------------------------------------------------------------------------

message CancelTicketByStaffRequest {
  string ticket_id = 1;
}

message CancelTicketByStaffResponse {}

// -----------------------------------------------------------------------------
// GetStaffSession
// -----------------------------------------------------------------------------

message GetStaffSessionRequest {}

message GetStaffSessionResponse {
  string booth_id   = 1;
  string booth_name = 2;
}

// -----------------------------------------------------------------------------
// ListTicketsByBooth
// -----------------------------------------------------------------------------

message StaffTicket {
  string ticket_id         = 1;
  int32  sequence_in_booth = 2;
  string reception_number  = 3;
  string nickname          = 4;
  int32  participant_count = 5;
  string status            = 6;
  bool   is_priority_call  = 7;
  string created_at        = 8;
  string pending_at        = 9;
}

message ListTicketsByBoothRequest {}

message ListTicketsByBoothResponse {
  repeated StaffTicket tickets = 1;
}

// -----------------------------------------------------------------------------
// RestorePendingTicket
// -----------------------------------------------------------------------------

message RestorePendingTicketRequest {
  string ticket_id = 1;
}

message RestorePendingTicketResponse {}

// -----------------------------------------------------------------------------
// GetRiskExplanation
// -----------------------------------------------------------------------------

message GetRiskExplanationRequest {}

message GetRiskExplanationResponse {
  string body       = 1;
  string updated_at = 2;
}

// -----------------------------------------------------------------------------
// UpdateRiskExplanation
// -----------------------------------------------------------------------------

message UpdateRiskExplanationRequest {
  string body = 1;
}

message UpdateRiskExplanationResponse {
  string updated_at = 1;
}

// -----------------------------------------------------------------------------
// ForceStartMatch
// -----------------------------------------------------------------------------

message ForceStartMatchRequest {}

message ForceStartMatchResponse {
  string session_id = 1;
}

// -----------------------------------------------------------------------------
// CallPrivateMatch
// -----------------------------------------------------------------------------

message CallPrivateMatchRequest {
  // ID of the private ticket whose match session should be called.
  string ticket_id = 1;
}

message CallPrivateMatchResponse {}

// -----------------------------------------------------------------------------
// CompleteMatchSession
// -----------------------------------------------------------------------------

message CompleteMatchSessionRequest {
  string session_id = 1;
}

message CompleteMatchSessionResponse {}

// -----------------------------------------------------------------------------
// GetMatchQueueStatus
// -----------------------------------------------------------------------------

// One group waiting in public mode.
message PublicWaitingGroup {
  string ticket_id         = 1;
  int32  sequence_in_booth = 2;
  int32  participant_count = 3;
}

// One group waiting in private mode.
message PrivateWaitingGroup {
  string ticket_id         = 1;
  int32  sequence_in_booth = 2;
  int32  participant_count = 3;
  string reception_number  = 4;
  string nickname          = 5;
}

// An in-progress or waiting match session.
message MatchQueueSession {
  string session_id        = 1;
  string mode              = 2;
  string status            = 3;
  int32  participant_count = 4;
  string created_at        = 5;
}

message GetMatchQueueStatusRequest {}

message GetMatchQueueStatusResponse {
  repeated PublicWaitingGroup  public_waiting        = 1;
  int32                        public_waiting_total  = 2;
  int32                        target_party_size     = 3;
  int32                        min_party_size        = 4;
  repeated PrivateWaitingGroup private_waiting       = 5;
  repeated MatchQueueSession   active_sessions       = 6;
}

// -----------------------------------------------------------------------------
// ListNotificationTemplates
// -----------------------------------------------------------------------------

message NotificationTemplate {
  string key      = 1;
  string title    = 2;
  string body     = 3;
  string icon_url = 4; // empty string means no icon
}

message ListNotificationTemplatesRequest {}

message ListNotificationTemplatesResponse {
  repeated NotificationTemplate templates = 1;
}

// -----------------------------------------------------------------------------
// UpdateNotificationTemplate
// -----------------------------------------------------------------------------

message UpdateNotificationTemplateRequest {
  string key      = 1;
  string title    = 2;
  string body     = 3;
  string icon_url = 4; // empty string clears the icon
}

message UpdateNotificationTemplateResponse {
  NotificationTemplate template = 1;
}

// -----------------------------------------------------------------------------
// ExportCSV
// -----------------------------------------------------------------------------

enum ExportType {
  EXPORT_TYPE_UNSPECIFIED    = 0;
  EXPORT_TYPE_VISITORS       = 1;
  EXPORT_TYPE_TICKETS        = 2;
  EXPORT_TYPE_ADMISSIONS     = 3;
  EXPORT_TYPE_BOOTH_SUMMARY  = 4;
  EXPORT_TYPE_HOURLY_STATS   = 5;
  EXPORT_TYPE_MATCH_SESSIONS = 6;
}

message ExportCSVRequest {
  ExportType export_type = 1;
}

message ExportCSVResponse {
  // UTF-8 BOM prefixed CSV bytes, ready for direct download.
  bytes  csv_data = 1;
  string filename = 2;
}

// -----------------------------------------------------------------------------
// ResetEventData
// -----------------------------------------------------------------------------

message ResetEventDataRequest {
  // Must equal "RESET" to confirm the destructive operation.
  string confirmation_token = 1;
}

message ResetEventDataResponse {
  string message = 1;
}

// -----------------------------------------------------------------------------
// CreateTicketManual (StaffService)
// -----------------------------------------------------------------------------

message ManualParticipantInput {
  int32  age  = 1;
  string name = 2; // required for participants aged < 13
}

message CreateTicketManualRequest {
  // Visitor identified by reception number (staff scans the QR).
  string reception_number = 1;
  repeated ManualParticipantInput participants = 2;
  // Required when any participant is aged 7-12 (paper_and_digital consent, R-005).
  string guardian_name          = 3;
  // Physical paper form reference ID (required for ages 7-9).
  string paper_form_id          = 4;
  // Full text of risk explanation shown to the guardian at the time of consent.
  string consent_text_snapshot  = 5;
}

message CreateTicketManualResponse {
  string ticket_id         = 1;
  int32  sequence_in_booth = 2;
}
